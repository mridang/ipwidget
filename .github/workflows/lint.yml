name: Lint Code (swiftlint)

on: push

permissions:
  contents: read

defaults:
  run:
    working-directory: ./

jobs:
  code-linting:
    # macOS runner: Xcode ships the Swift toolchain used to build this app, so
    # linting runs alongside it rather than on the Linux runners the SPM/Node
    # repos use. (action-runner-common is omitted here for the same reason
    # noted in release.yml.)
    runs-on: macos-15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Run SwiftLint
        run: swiftlint lint --strict IPWidgetApp IPWidgetExtension Packages/IPWidgetKit/Sources Packages/IPWidgetKit/Tests
