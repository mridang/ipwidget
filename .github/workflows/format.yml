name: Format Code (swift-format)

on: pull_request

permissions:
  contents: read

defaults:
  run:
    working-directory: ./

jobs:
  code-formatting:
    # macOS runner: Xcode ships swift-format (the `swift format` subcommand)
    # already, so no separate setup step is needed, unlike the Linux runners
    # the SPM repos use. (action-runner-common is omitted here for the same
    # reason noted in release.yml.)
    runs-on: macos-15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Check swift-format
        run: swift format lint --strict --recursive IPWidgetApp IPWidgetExtension Packages/IPWidgetKit/Sources Packages/IPWidgetKit/Tests
